[project]
name = "sk-llm-eval"
version = "0.1.0"
description = "A practical benchmark for Slovak language quality in LLM responses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sk-llm-eval = "sk_llm_eval.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sk_llm_eval*"]
